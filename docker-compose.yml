services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nucleus-backend
    ports:
      - "8800:8800"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    volumes:
      # Persist SQLite DB, encrypted cache, and audit log across restarts
      - nucleus-data:/app/data
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/health')" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nucleus-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nucleus-data:
    driver: local
